<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Músicas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ========= Tema AUDÁZ ========= */
    :root{
      --audaz-cyan:  #22d3ee;  /* ciano neon */
      --audaz-blue:  #60a5fa;  /* azul claro */
      --audaz-amber: #f59e0b;  /* âmbar do “OPERACIONAL” (#EEA403 aprox.) */
      --navy-0: #061520;
      --navy-1: #0b1c2e;
      --navy-2: #0f2439;
    }

    html, body { height:100%; margin:0; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; }

    /* Fundo “galáxia” (desligável com ?transparent=1) */
    body{
      background:
        radial-gradient(1200px 700px at 50% 0%, var(--navy-2) 0%, var(--navy-1) 40%, var(--navy-0) 100%),
        linear-gradient(180deg, var(--navy-1), var(--navy-0));
      position: relative;
      overflow: hidden;
    }
    body::before{
      content:"";
      position: fixed; inset: 0;
      background:
        radial-gradient(1px 1px at 8% 18%,  rgba(255,255,255,.30), transparent 2px),
        radial-gradient(1px 1px at 22% 38%, rgba(255,255,255,.22), transparent 2px),
        radial-gradient(1px 1px at 35% 12%, rgba(255,255,255,.18), transparent 2px),
        radial-gradient(1px 1px at 48% 27%, rgba(255,255,255,.28), transparent 2px),
        radial-gradient(1px 1px at 62% 15%, rgba(255,255,255,.20), transparent 2px),
        radial-gradient(1px 1px at 72% 44%, rgba(255,255,255,.24), transparent 2px),
        radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,.18), transparent 2px),
        radial-gradient(1px 1px at 16% 65%, rgba(255,255,255,.20), transparent 2px),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.26), transparent 2px),
        radial-gradient(1px 1px at 68% 78%, rgba(255,255,255,.18), transparent 2px),
        radial-gradient(1px 1px at 88% 60%, rgba(255,255,255,.22), transparent 2px);
      opacity: .55;
      pointer-events: none;
    }
    body::after{
      content:"";
      position: fixed; inset: 0;
      background:
        radial-gradient(800px 400px at 50% 20%, rgba(34,211,238,.10), transparent 70%),
        radial-gradient(600px 300px at 80% 70%, rgba(96,165,250,.07), transparent 70%);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    /* Modo transparente (ativar com ?transparent=1) */
    body.transparent,
    body.transparent::before,
    body.transparent::after { background: transparent !important; }
    body.transparent::before, body.transparent::after { content:none !important; }

    /* ========= Botões vidro + borda neon ========= */
    .btn-audaz{
      position:relative;
      padding:0.9rem 1.25rem;
      border-radius:9999px;
      color:#fff; font-weight:600;
      background:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)),
        rgba(8,14,22,.22);
      backdrop-filter: blur(4px);
      box-shadow: 0 18px 40px rgba(0,0,0,.40), 0 1px 0 rgba(255,255,255,.06) inset;
      transition: transform .12s ease, box-shadow .2s ease, opacity .2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap:.5rem;
    }
    .btn-audaz::before{
      content:""; position:absolute; inset:-2px; border-radius:inherit; padding:2px;
      background: linear-gradient(90deg, var(--audaz-cyan), var(--audaz-blue), var(--audaz-amber));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity:.9; pointer-events:none; transition:opacity .2s ease;
    }
    .btn-audaz:hover{ transform: translateY(1px); }
    .btn-audaz:hover::before{ opacity:1; }
    .btn-audaz[disabled]{ opacity:.6; cursor:not-allowed; }
    .btn-audaz svg{ flex:0 0 auto; }

    /* Cards/área */
    .panel{
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      box-shadow: 0 30px 60px rgba(0,0,0,.35);
      padding: 18px;
    }
    #status{ color:#e6f6ff; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  </style>
  <script>
    // Ativa modo transparente via ?transparent=1
    (function(){
      const qs = new URLSearchParams(location.search);
      if (qs.get('transparent') === '1') document.body?.classList.add('transparent');
    })();
  </script>
</head>

<body>
  <div class="min-h-full w-full flex items-center justify-center p-4">
    <div class="w-full max-w-4xl panel">
      <h1 class="text-center text-xl sm:text-2xl font-semibold text-white mb-4 drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)]">
        🎶 Escolha uma música
      </h1>

      <!-- grade de botões -->
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Os botões são injetados por JS com base no array de faixas -->
      </div>

      <div id="status" class="mt-3 text-center text-sm" aria-live="polite"></div>
    </div>
  </div>

  <script>
    // Se precisar de segredo, preencha aqui; se não, deixe vazio:
    const SECRET = ""; // exemplo: "audaz"

    // Lista de faixas (rótulo visível e nome do arquivo enviado ao backend)
    const tracks = [
      { label: "Vem Carguinha",     file: "vem_carguinha.mp3" },
      { label: "Vem Carguinha 2",   file: "vem_carguinha_2.mp3" },
      { label: "Vem Carguinha 3",   file: "vem_carguinha_3.mp3" },
      { label: "Vem Carguinha 4",   file: "vem_carguinha_4.mp3" },
      { label: "Vem Carguinha 5",   file: "vem_carguinha_5.mp3" },
      { label: "Vem Carguinha 6",   file: "vem_carguinha_6.mp3" },
      { label: "Vem Carguinha 7",   file: "vem_carguinha_7.mp3" },
      { label: "Renegade",          file: "renegade.mp3" },
      { label: "Eco",               file: "eco.mp3" }
    ];

    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');

    // cria os botões
    tracks.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = "btn-audaz";
      btn.dataset.file = t.file;
      btn.innerHTML = `
        <svg class="icon h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <span>${t.label}</span>
        <svg class="spin hidden h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
      `;
      btn.addEventListener('click', () => tocar(btn));
      grid.appendChild(btn);
    });

    async function tocar(btnEl){
      const file = btnEl.dataset.file;
      const spin = btnEl.querySelector('.spin');
      const bolt = btnEl.querySelector('.icon');
      btnEl.disabled = true;
      spin.classList.remove('hidden'); bolt.classList.add('hidden');
      statusEl.textContent = "Enviando…";

      try{
        const res = await fetch('/tocar-musica', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(SECRET ? {'x-alert-secret': SECRET} : {})
          },
          body: JSON.stringify({ arquivo: file })
        });
        const data = await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error || res.statusText);
        statusEl.textContent = `OK! Pedido para tocar "${file}" enviado.`;
      }catch(e){
        statusEl.textContent = "Falha: " + (e.message || e);
      }finally{
        spin.classList.add('hidden'); bolt.classList.remove('hidden');
        btnEl.disabled = false;
      }
    }
  </script>
</body>
</html>
